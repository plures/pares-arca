[package]
name = "arca-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core library for Pares Arca — distributed Nix binary cache"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
toml = "0.8"
dirs-next = "2"
xz2 = { workspace = true }
walkdir = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
pluresdb-core = { workspace = true, optional = true }
pluresdb-storage = { workspace = true, optional = true }
chrono = { workspace = true }

[features]
default = ["pluresdb"]
pluresdb = ["dep:pluresdb-core", "dep:pluresdb-storage"]
