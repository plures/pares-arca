[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/plures/pares-cache"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive", "env"] }
xz2 = "0.1"
walkdir = "2"
tempfile = "3"
snow = "0.9"
rand = "0.8"
bytes = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }

# plures-object crates (content-addressed chunked storage)
plures-object-core = { git = "https://github.com/plures/plures-object.git", branch = "main" }
plures-chunkstore = { git = "https://github.com/plures/plures-object.git", branch = "main" }
plures-manifest-db = { git = "https://github.com/plures/plures-object.git", branch = "main" }
plures-object-store = { git = "https://github.com/plures/plures-object.git", branch = "main" }
