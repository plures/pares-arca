[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/plures/pares-arca"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive", "env"] }
xz2 = "0.1"
walkdir = "2"
tempfile = "3"
snow = "0.9"
rand = "0.8"
pluresdb-storage = { git = "https://github.com/plures/pluresdb.git", rev = "fcac0f2d", features = ["native"] }
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sled = "0.34"
zstd = "0.13"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
